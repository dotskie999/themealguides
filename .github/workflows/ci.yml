name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SECRET_KEY: sb_secret_ci_build_placeholder
      ADMIN_PIN: ci-only-placeholder
      ADMIN_SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and build
        run: npm run check
